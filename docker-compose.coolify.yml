version: '3.9'

services:
  ticoeur-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticoeur-website
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ticoeur.rule=Host(`ticoeur.store`)"
      - "traefik.http.routers.ticoeur.entrypoints=http"
      - "traefik.http.services.ticoeur.loadbalancer.server.port=80"
    networks:
      - coolify

networks:
  coolify:
    external: true